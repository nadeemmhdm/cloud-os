ss="small">Group users and grant team roles.</div></div><button id="addTeam" class="btn">Create team</button></div><div class="list">'+(t.length?t.map(x=>'<div class="row"><span><b>'+E(x.name)+'</b><br><span class="small">'+Object.keys(x.members||{}).length+' member(s)</span></span><button class="btn" data-team="'+E(x.name)+'">Add member</button></div>').join(""):'<div class="empty">No teams yet.</div>')+'</div></div></div>';q("#addUser").onclick=async()=>{if(!await modal("Add user",'<input id="uName" placeholder="Username"><input id="uDisplay" placeholder="Display name"><input id="uPass" type="password" placeholder="Password (12+ characters)"><select id="uRole"><option value="member">Member</option><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Admin</option></select>',"Create"))return;let username=q("#uName").value.trim(),password=q("#uPass").value,display_name=q("#uDisplay").value.trim(),role=q("#uRole").value;if(!username||!password)return notice("Missing information","Username and password are required.");try{await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password,display_name:display_name||username,role})});users()}catch(e){await notice("Could not create user",e.code+": "+e.message)}};document.querySelectorAll("[data-pass]").forEach(b=>b.onclick=async()=>{if(!await modal("Reset password",'<p class="small">@'+E(b.dataset.pass)+'</p><input id="resetPass" type="password" placeholder="New password (12+ characters)">',"Reset"))return;let p=q("#resetPass").value;if(!p)return;try{await api("/api/users/"+encodeURIComponent(b.dataset.pass)+"/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({new_password:p})});await notice("Password updated","Existing sessions were revoked.")}catch(e){await notice("Password reset failed",e.code+": "+e.message)}});document.querySelectorAll("[data-state]").forEach(b=>b.onclick=async()=>{let disabled=b.dataset.disabled!=="true";if(!await modal((disabled?"Block ":"Unblock ")+b.dataset.state,"<p>Confirm this account change?</p>","Confirm"))return;try{await api("/api/users/"+encodeURIComponent(b.dataset.state)+"/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({disabled})});users()}catch(e){await notice("Account update failed",e.code+": "+e.message)}});q("#addTeam").onclick=async()=>{if(!await modal("Create team",'<input id="teamName" placeholder="Team name">',"Create"))return;let name=q("#teamName").value.trim();if(!name)return;try{await api("/api/teams",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});users()}catch(e){await notice("Could not create team",e.code+": "+e.message)}};document.querySelectorAll("[data-team]").forEach(b=>b.onclick=async()=>{if(!await modal("Add team member",'<input id="memberName" placeholder="Existing username"><select id="memberRole"><option value="member">Member</option><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Admin</option></select>',"Add"))return;let username=q("#memberName").value.trim(),role=q("#memberRole").value;if(!username)return;try{await api("/api/teams/"+encodeURIComponent(b.dataset.team)+"/members",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,role})});users()}catch(e){await notice("Could not add member",e.code+": "+e.message)}})}async function audit(){let a=await api("/api/audit");q("#content").innerHTML='<div class="card glass"><div class="sectionbar"><h3>Audit</h3><button id="auditRefresh" class="btn">Refresh</button></div><div class="list">'+(a.length?a.slice().reverse().map(x=>'<div class="row"><span><b>'+E(x.action)+'</b><br><span class="small">'+E(x.detail||"")+'</span></span><span class="small">'+E(new Date(x.time).toLocaleString())+'</span></div>').join(""):'<div class="empty">No audit events yet.</div>')+'</div></div>';q("#auditRefresh").onclick=audit}async function integrations(){let d=await api("/api/integrations"),s=d.ssh;q("#content").innerHTML='<div class="grid"><div class="card glass wide"><h3>Cloud OS SSH</h3><p class="muted">Native Cloud OS server shell. Windows uses PowerShell; Linux uses Bash. Access follows Cloud OS terminal permissions.</p><div class="kv"><b>Status</b><span class="kvalue">'+(s.running?"Running":"Stopped")+'</span><span></span></div><div class="kv"><b>Port</b><code class="kvalue">'+E(s.port)+'</code><span></span></div><div class="kv"><b>Connect</b><code class="kvalue">ssh -p '+E(s.port)+' USER@SERVER_IP</code><span></span></div><div class="small">Login with a Cloud OS Owner/Admin/Operator account that has terminal permission. Standard shell commands available to the Cloud OS server process can run here.</div></div><div class="card glass wide"><h3>Cloudflare</h3><pre>'+E(JSON.stringify(d.cloudflare,null,2))+'</pre></div></div>'}async function settings(tab="account"){let tabs='<div class="settings-tabs"><button class="btn '+(tab==="account"?"active":"")+'" data-st="account">Account</button><button class="btn '+(tab==="ai"?"active":"")+'" data-st="ai">AI Configuration</button><button class="btn '+(tab==="about"?"active":"")+'" data-st="about">About</button></div>';if(tab==="account"){let d=await api("/api/doctor");q("#content").innerHTML=tabs+'<div class="grid"><div class="card glass wide"><h3>Account security</h3><p class="muted">Change the password for @'+E(me.username)+'. You will be signed out after a successful change.</p><div class="form-grid"><input id="currentPass" type="password" placeholder="Current password"><input id="newPass" type="password" placeholder="New password (12+ characters)"></div><button id="changePass" class="btn primary" style="margin-top:10px">Change password</button></div><div class="card glass wide"><h3>System health</h3><div class="list">'+d.checks.map(x=>'<div class="row"><span>'+E(x.name)+'</span><span>'+(x.ok?"PASS":"WARN")+'</span></div>').join("")+'</div></div></div>';q("#changePass").onclick=async()=>{try{await api("/api/account/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current_password:q("#currentPass").value,new_password:q("#newPass").value})});await notice("Cloud OS","Password changed. Sign in again.");location.reload()}catch(e){await notice("Cloud OS",e.code+": "+e.message)}}}else if(tab==="ai"){let s=await api("/api/ai/status");q("#content").innerHTML=tabs+'<div class="card glass"><div class="sectionbar"><div><h3 style="margin:0">AI Configuration</h3><div class="small">Provider keys remain on your Cloud OS host.</div></div></div><div class="list">'+Object.entries(s).map(([k,v])=>'<div class="row"><span><b>'+E(k)+'</b><br><span class="small">'+(v.configured?"Configured · "+E(v.model||"default model"):"Not configured")+'</span></span><span class="row-actions"><button class="btn" data-ai-config="'+E(k)+'">Configure</button>'+(v.configured?'<button class="btn danger" data-ai-remove="'+E(k)+'">Remove</button>':'')+'</span></div>').join("")+'</div></div>';document.querySelectorAll("[data-ai-config]").forEach(b=>b.onclick=async()=>{if(!await modal("Configure "+b.dataset.aiConfig,'<input id="aiKey" type="password" placeholder="API key"><input id="aiModel" placeholder="Model name (optional)">',"Configure"))return;let key=q("#aiKey").value,model=q("#aiModel").value.trim();if(!key)return;await api("/api/ai/configure",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:b.dataset.aiConfig,api_key:key,model:model||""})});settings("ai")});document.querySelectorAll("[data-ai-remove]").forEach(b=>b.onclick=async()=>{if(!await modal("Remove AI configuration","<p>Remove "+E(b.dataset.aiRemove)+" configuration?</p>","Remove"))return;await api("/api/ai/"+encodeURIComponent(b.dataset.aiRemove),{method:"DELETE"});settings("ai")})}else{let d=await api("/api/system/details"),gb=n=>(n/1073741824).toFixed(2)+" GB",rows=[["System name",d.system_name],["Operating system",d.os+" "+d.os_release],["OS build / version",d.os_version],["Architecture",d.architecture],["Processor",d.processor],["CPU cores",d.cpu_physical_cores+" physical / "+d.cpu_logical_cores+" logical"],["RAM",gb(d.ram_total)],["Graphics",d.graphics],["Python",d.python],["Cloud OS",d.cloud_os_version],["Storage",d.drives.map(x=>(x.device||x.mount)+" · "+gb(x.total)+" total · "+gb(x.free)+" free").join(" | ")||"Unavailable"]];q("#content").innerHTML=tabs+'<div class="card glass"><div class="sectionbar"><div><h3 style="margin:0">About Cloud OS</h3><div class="small">Host system and Cloud OS build information.</div></div><button id="copyAll" class="btn">Copy all</button></div><div id="aboutRows">'+rows.map(x=>'<div class="kv"><b>'+E(x[0])+'</b><code class="kvalue">'+E(x[1])+'</code><button class="btn copyVal" data-copy="'+E(x[1])+'">Copy</button></div>').join("")+'</div><div style="margin-top:18px" class="small">Cloud OS built by <b>Nadeem</b> · <a style="color:#aeb8ff" href="https://github.com/nadeemmhdm/cloud-os" target="_blank" rel="noopener">GitHub repository</a></div></div>';document.querySelectorAll(".copyVal").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy));q("#copyAll").onclick=()=>navigator.clipboard.writeText(rows.map(x=>x[0]+": "+x[1]).join("\n"))}document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>settings(b.dataset.st))}q("#chatFab").onclick=()=>q("#chatBox").classList.toggle("open");q("#chatClose").onclick=()=>q("#chatBox").classList.remove("open");q("#chatSend").onclick=async()=>{let prompt=q("#chatText").value.trim();if(!prompt)return;q("#chatText").value="";q("#chatLog").innerHTML+='<div class="chatmsg me">'+E(prompt)+'</div><div id="thinking" class="chatmsg">Thinking…</div>';q("#chatLog").scrollTop=q("#chatLog").scrollHeight;try{let r=await api("/api/ai/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});q("#thinking").outerHTML='<div class="chatmsg">'+E(r.answer)+'</div>'}catch(e){q("#thinking").outerHTML='<div class="chatmsg error">'+E(e.code+": "+e.message+(e.detail?" — "+e.detail:""))+'</div>'}q("#chatLog").scrollTop=q("#chatLog").scrollHeight};q("#chatText").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();q("#chatSend").click()}};start();
</script></body></html>
