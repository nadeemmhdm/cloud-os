const pages=["overview","files","terminal","ai","backups","users","audit","integrations","settings"];let me,page="overview",metricTimer=null;const q=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));async function api(u,o={}){let r=await fetch(u,{credentials:"same-origin",...o}),d=await r.json();if(!r.ok)throw(d.detail?.error||d.error||{code:"SYS-001",message:"Request failed"});return d}function nav(){let f=x=>'<button data-p="'+x+'" class="'+(x===page?"active":"")+'">'+x[0].toUpperCase()+x.slice(1)+"</button>";q("#nav").innerHTML=pages.map(f).join("");q("#mobile").innerHTML=pages.map(f).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{q("#mobile").classList.remove("open");q("#hamb").setAttribute("aria-expanded","false");open(b.dataset.p)})}function show(){q("#login").classList.add("hidden");q("#app").classList.remove("hidden");q("#who").textContent=me.username;q("#role").textContent=me.role;nav();open("overview")}async function start(){setTimeout(()=>q("#boot").classList.add("hide"),650);try{me=await api("/api/me");show()}catch(e){q("#login").classList.remove("hidden")}}q("#lf").onsubmit=async e=>{e.preventDefault();try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:q("#u").value,password:q("#p").value})});me=d.user;show()}catch(x){q("#err").textContent=x.code+": "+x.message}};q("#hamb").onclick=()=>{let o=q("#mobile").classList.toggle("open");q("#hamb").setAttribute("aria-expanded",String(o));q("#hamb").textContent=o?"×":"☰"};q("#logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()};function open(p){if(metricTimer){clearInterval(metricTimer);metricTimer=null}page=p;nav();q("#title").textContent=p[0].toUpperCase()+p.slice(1);({overview,files,terminal,ai,backups,users,audit,integrations,settings}[p])().catch(x=>q("#content").innerHTML='<div class="card glass">'+E(x.code)+": "+E(x.message)+"</div>")}async function overview(){let [d,b]=await Promise.all([api("/api/system"),api("/api/booster")]);q("#content").innerHTML='<div class="card glass wide" style="margin-bottom:14px"><div class="row"><div><b>Performance Booster</b><div class="small">Raises Cloud OS process scheduling priority. No overclocking.</div></div><button id="boost" class="btn primary">'+(b.mode==="boosted"?"Return Normal":"Boost Cloud OS")+'</button></div></div><div class="grid">'+[["CPU","cpu"],["Memory","ram"],["Storage","disk"]].map(x=>'<div class="card glass metric"><span class="muted">'+x[0]+'</span><b id="m-'+x[1]+'">0%</b><div class="bar"><i id="b-'+x[1]+'" style="width:0%"></i></div></div>').join("")+'<div id="sysmeta" class="card glass wide"></div></div>';let paint=x=>{["cpu","ram","disk"].forEach(k=>{q("#m-"+k).textContent=Math.round(x[k])+"%";q("#b-"+k).style.width=x[k]+"%"});q("#sysmeta").textContent=x.platform+" · Cloud OS v"+x.version+" · uptime "+Math.floor(x.uptime/60)+" min · live update every 2s"};paint(d);q("#boost").onclick=async()=>{await api("/api/booster",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:b.mode!=="boosted"})});overview()};metricTimer=setInterval(async()=>{if(page!=="overview")return;try{paint(await api("/api/system"))}catch(e){}},2000)}async function files(path=""){window.filePath=path;let a=await api("/api/files?path="+encodeURIComponent(path));let parts=path?path.split("/").filter(Boolean):[];let crumbs='<button data-dir="">Storage</button>';let acc="";parts.forEach(x=>{acc+=(acc?"/":"")+x;crumbs+=' / <button data-dir="'+E(acc)+'">'+E(x)+'</button>'});let rows=a.length?a.map(x=>{let rel=(path?path+"/":"")+x.name;return '<div class="row"><div class="file-name"><span>'+(x.directory?"📁":"📄")+'</span>'+(x.directory?'<button data-dir="'+E(rel)+'">'+E(x.name)+'</button>':'<span>'+E(x.name)+'</span>')+'</div><div class="row-actions">'+(!x.directory?'<a class="btn" href="/api/download?path='+encodeURIComponent(rel)+'">Download</a>':'')+'<button class="btn danger" data-del="'+E(rel)+'">Delete</button></div></div>'}).join(""):'<div class="empty">This folder is empty. Upload a file or create a folder.</div>';q("#content").innerHTML='<div class="card glass"><div class="sectionbar"><h3>Files</h3><button id="refreshFiles" class="btn">Refresh</button></div><div class="toolbar"><button id="newFolder" class="btn primary">New folder</button><button id="uploadBtn" class="btn">Upload file</button><input id="uploadFile" type="file" hidden></div><div class="crumb">'+crumbs+'</div><div class="list">'+rows+'</div></div>';document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>files(b.dataset.dir));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete "+b.dataset.del+"?"))return;await api("/api/files?path="+encodeURIComponent(b.dataset.del),{method:"DELETE"});files(path)});q("#refreshFiles").onclick=()=>files(path);q("#newFolder").onclick=async()=>{let n=prompt("Folder name");if(!n)return;await api("/api/folder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:(path?path+"/":"")+n})});files(path)};q("#uploadBtn").onclick=()=>q("#uploadFile").click();q("#uploadFile").onchange=async()=>{let file=q("#uploadFile").files[0];if(!file)return;let fd=new FormData();fd.append("file",file);q("#uploadBtn").textContent="Uploading…";try{await api("/api/upload?path="+encodeURIComponent(path),{method:"POST",body:fd});files(path)}catch(e){alert(e.code+": "+e.message);q("#uploadBtn").textContent="Upload file"}}}async function terminal(){let s=await api("/api/terminal/shells");let shells=s.shells||[];q("#content").innerHTML='<div class="toolbar"><select id="shell" class="select">'+shells.map(x=>'<option>'+E(x)+'</option>').join("")+'</select><span class="small">Commands execute on this Cloud OS host inside the configured storage root.</span></div><div class="terminal"><div class="lights"><i></i><i></i><i></i> Host terminal</div><pre id="out">Cloud OS host terminal ready.\nShell: '+E(shells[0]||"none")+'\n\n</pre><form id="tf" class="termform"><input id="cmd" autocomplete="off" placeholder="Enter host command…" '+(!shells.length?"disabled":"")+'><button '+(!shells.length?"disabled":"")+'>Run</button></form><div id="termStatus" class="term-status">Ready</div></div>';if(!shells.length){q("#out").textContent+="No supported host shell detected.\n";return}q("#tf").onsubmit=async e=>{e.preventDefault();let c=q("#cmd").value.trim();if(!c)return;q("#cmd").value="";let out=q("#out"),st=q("#termStatus");out.textContent+="> "+c+"\n";st.textContent="Running…";try{let r=await api("/api/terminal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:c,shell:q("#shell").value,privileged:false})});let text=(r.stdout||"")+(r.stderr||"");out.textContent+=(text||"[command completed with no output]")+(text.endsWith("\n")?"":"\n");st.textContent="Exit code "+r.code+" · "+r.shell;out.scrollTop=out.scrollHeight}catch(x){out.textContent+=x.code+": "+x.message+(x.detail?" — "+x.detail:"")+"\n";st.textContent="Command failed";out.scrollTop=out.scrollHeight}}}async function ai(){let s=await api("/api/ai/status");q("#content").innerHTML='<div class="grid"><div class="card glass wide"><h3>Cloud OS AI Help</h3><p class="muted">Uses Cloud OS Markdown documentation as local reference context. API keys stay server-side.</p><div class="row"><select id="provider" class="btn">'+Object.entries(s).map(([k,v])=>'<option value="'+k+'">'+k+(v.configured?" · configured":" · not configured")+'</option>').join("")+'</select><button id="setupAI" class="btn">Configure provider</button></div><textarea id="question" style="width:100%;min-height:120px;margin-top:12px;background:#080a0f88;color:white;border:1px solid #ffffff17;border-radius:13px;padding:13px" placeholder="Ask about an error, setup issue, or Cloud OS feature…"></textarea><button id="askAI" class="btn primary" style="margin-top:10px">Ask async function backups(){let a=await api("/api/backups");q("#content").innerHTML='<div class="card glass"><div class="sectionbar"><div><h3 style="margin:0">Backups</h3><div class="small">Snapshots of the configured Cloud OS storage root.</div></div><button id="createBackup" class="btn primary">Create backup</button></div><div class="list">'+(a.length?a.map(x=>'<div class="row"><span>📦 '+E(x)+'</span><span class="small">Stored locally</span></div>').join(""):'<div class="empty">No backups yet. Create your first backup.</div>')+'</div></div>';q("#createBackup").onclick=async()=>{let b=q("#createBackup");b.disabled=true;b.textContent="Creating…";try{await api("/api/backup",{method:"POST"});backups()}catch(e){b.disabled=false;b.textContent="Create backup";alert(e.code+": "+e.message)}}}async function users(){let [a,t]=await Promise.all([api("/api/users"),api("/api/teams")]);let fmt=v=>v?new Date(v).toLocaleString():"Never";q("#content").innerHTML='<div class="grid"><div class="card glass wide"><div class="sectionbar"><div><h3 style="margin:0">Users</h3><div class="small">Accounts, access state and login history.</div></div><button id="addUser" class="btn primary">Add user</button></div><div class="list">'+a.map(x=>'<div class="row"><span><b>'+E(x.display_name||x.username)+'</b> <span class="small">@'+E(x.username)+' · '+E(x.role)+(x.disabled?" · BLOCKED":"")+'</span><br><span class="small">First login: '+E(fmt(x.first_login_at))+' · Last login: '+E(fmt(x.last_login_at))+'</span></span><span class="row-actions">'+(x.username!=="admin"?'<button class="btn" data-pass="'+E(x.username)+'">Reset password</button><button class="btn '+(x.disabled?"":"danger")+'" data-state="'+E(x.username)+'" data-disabled="'+String(!!x.disabled)+'">'+(x.disabled?"Unblock":"Block")+'</button>':'<span class="small">Built-in owner</span>')+'</span></div>').join("")+'</div></div><div class="card glass wide"><div class="sectionbar"><div><h3 style="margin:0">Teams</h3><div class="small">Group users and grant team roles.</div></div><button id="addTeam" class="btn">Create team</button></div><div class="list">'+(t.length?t.map(x=>'<div class="row"><span><b>'+E(x.name)+'</b><br><span class="small">'+Object.keys(x.members||{}).length+' member(s)</span></span><button class="btn" data-team="'+E(x.name)+'">Add member</button></div>').join(""):'<div class="empty">No teams yet.</div>')+'</div></div></div>';q("#addUser").onclick=async()=>{let username=prompt("Username"),password=username&&prompt("Password (minimum 12 characters)"),display_name=username&&prompt("Display name",username),role=username&&prompt("Role: admin, operator, member, viewer","member");if(!username||!password)return;try{await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password,display_name:display_name||username,role:role||"member"})});users()}catch(e){alert(e.code+": "+e.message)}};document.querySelectorAll("[data-pass]").forEach(b=>b.onclick=async()=>{let p=prompt("New password for "+b.dataset.pass+" (minimum 12 characters)");if(!p)return;try{await api("/api/users/"+encodeURIComponent(b.dataset.pass)+"/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({new_password:p})});alert("Password updated. Existing sessions were revoked.")}catch(e){alert(e.code+": "+e.message)}});document.querySelectorAll("[data-state]").forEach(b=>b.onclick=async()=>{let disabled=b.dataset.disabled!=="true";if(!confirm((disabled?"Block ":"Unblock ")+b.dataset.state+"?"))return;await api("/api/users/"+encodeURIComponent(b.dataset.state)+"/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({disabled})});users()});q("#addTeam").onclick=async()=>{let name=prompt("Team name");if(!name)return;await api("/api/teams",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});users()};document.querySelectorAll("[data-team]").forEach(b=>b.onclick=async()=>{let username=prompt("Existing username to add"),role=username&&prompt("Team role: admin, operator, member, viewer","member");if(!username)return;await api("/api/teams/"+encodeURIComponent(b.dataset.team)+"/members",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,role:role||"member"})});users()})}async function audit(){let a=await api("/api/audit");q("#content").innerHTML='<div class="card glass"><div class="sectionbar"><h3>Audit</h3><button id="auditRefresh" class="btn">Refresh</button></div><div class="list">'+(a.length?a.slice().reverse().map(x=>'<div class="row"><span><b>'+E(x.action)+'</b><br><span class="small">'+E(x.detail||"")+'</span></span><span class="small">'+E(new Date(x.time).toLocaleString())+'</span></div>').join(""):'<div class="empty">No audit events yet.</div>')+'</div></div>';q("#auditRefresh").onclick=audit}async function integrations(){let d=await api("/api/integrations");q("#content").innerHTML='<div class="grid">'+Object.entries(d).map(([k,v])=>'<div class="card glass"><h3>'+E(k)+'</h3><pre>'+E(JSON.stringify(v,null,2))+'</pre></div>').join("")+'</div>'}async function settings(){let d=await api("/api/doctor");q("#content").innerHTML='<div class="grid"><div class="card glass wide"><h3>Account security</h3><p class="muted">Change the password for @'+E(me.username)+'. You will be signed out after a successful change.</p><div class="form-grid"><input id="currentPass" type="password" placeholder="Current password"><input id="newPass" type="password" placeholder="New password (12+ characters)"></div><button id="changePass" class="btn primary" style="margin-top:10px">Change password</button></div><div class="card glass wide"><h3>System health</h3><div class="list">'+d.checks.map(x=>'<div class="row"><span>'+E(x.name)+'</span><span>'+(x.ok?"PASS":"WARN")+'</span></div>').join("")+'</div></div></div>';q("#changePass").onclick=async()=>{let current_password=q("#currentPass").value,new_password=q("#newPass").value;if(!current_password||!new_password)return;try{await api("/api/account/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current_password,new_password})});alert("Password changed. Sign in again.");location.reload()}catch(e){alert(e.code+": "+e.message)}}}start();
