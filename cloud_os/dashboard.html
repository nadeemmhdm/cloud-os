<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cloud OS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080a0f;color:#f7f8fb;min-height:100vh}.wall{position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#334c7a 0,transparent 35%),radial-gradient(circle at 80% 80%,#422b5d 0,transparent 30%),#090b11;z-index:-1}.glass{background:#181b24c7;border:1px solid #ffffff16;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 25px 70px #0007}.hidden{display:none!important}.muted,.small{color:#9ca3b2}.small{font-size:12px}.btn{border:1px solid #ffffff16;background:#ffffff0d;color:white;padding:11px 14px;border-radius:13px;cursor:pointer}.primary{background:#788deb}.boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#050609;transition:.65s}.boot.hide{opacity:0;visibility:hidden}.bootbox{text-align:center}.mark{width:78px;height:64px;margin:auto;display:grid;place-items:center;animation:float 1.8s ease-in-out infinite;filter:drop-shadow(0 12px 22px #5579ff55)}.mark svg,.mark img{width:100%;height:100%;object-fit:contain;border-radius:18px}.brandmark{display:flex;align-items:center;gap:10px}.brandmark svg,.brandmark img{width:30px;height:30px;object-fit:contain;border-radius:8px;filter:drop-shadow(0 6px 12px #5579ff55)}.loader{width:160px;height:4px;background:#ffffff12;border-radius:8px;margin:25px auto;overflow:hidden}.loader i{display:block;height:100%;width:45%;background:#a9b6ff;animation:load 1.2s ease-in-out infinite}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(410px,100%);padding:30px;border-radius:28px;animation:rise .55s ease}.field{display:grid;gap:7px;margin:17px 0}.field input{border:1px solid #ffffff17;background:#080a0f88;color:white;padding:13px;border-radius:13px}.loginbox .primary{width:100%}.error{color:#ff9ca6;font-size:13px;margin-top:12px}.app{display:grid;grid-template-columns:240px 1fr;gap:14px;padding:14px;min-height:100dvh}.side{border-radius:26px;padding:18px;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100dvh - 28px)}.brand{font-weight:750;padding:8px 6px 22px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b5bac8;text-align:left;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.2s}.nav button:hover,.nav button.active{background:#ffffff12;color:white;transform:translateX(2px)}.account{margin-top:auto;border-top:1px solid #ffffff12;padding-top:14px}.main{min-width:0;padding:18px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0}.online:before{content:"";display:inline-block;width:8px;height:8px;background:#62d18b;border-radius:50%;margin-right:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{padding:19px;border-radius:22px;animation:rise .42s ease}.metric b{display:block;font-size:32px;margin:8px 0}.bar{height:6px;background:#ffffff10;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#8fa2ff;transition:width .7s}.wide{grid-column:1/-1}.list{display:grid;gap:7px}.row{display:flex;justify-content:space-between;padding:12px;border:1px solid #ffffff10;background:#ffffff07;border-radius:13px}.terminal{background:#04060a;border:1px solid #ffffff12;border-radius:18px;overflow:hidden}.lights{padding:10px;border-bottom:1px solid #ffffff10}.lights i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff6961;margin-right:5px}.lights i:nth-child(2){background:#ffd05a}.lights i:nth-child(3){background:#63d985}.terminal pre{min-height:300px;max-height:55vh;overflow:auto;margin:0;padding:16px;white-space:pre-wrap;font:13px ui-monospace,monospace}.termform{display:flex;border-top:1px solid #ffffff10}.termform input{flex:1;background:transparent;border:0;color:white;padding:14px}.termform button{background:#ffffff0c;color:white;border:0;padding:0 18px}.mobile{display:none}.hamb{display:none;border:1px solid #ffffff16;background:#ffffff0d;color:white;width:42px;height:42px;border-radius:12px;font-size:22px;line-height:1;cursor:pointer}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(260%)}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:760px){.app{display:block;padding:0}.side{display:none}.main{padding:20px 14px 70px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hamb{display:block}.mobile{display:none;position:fixed;top:72px;right:14px;left:auto;bottom:auto;width:min(280px,calc(100% - 28px));z-index:30;border-radius:19px;padding:8px;flex-direction:column;box-shadow:0 24px 60px #000a}.mobile.open{display:flex;animation:rise .2s ease}.mobile button{border:0;background:transparent;color:#aeb3c0;padding:12px;border-radius:11px;font-size:14px;text-align:left}.mobile button.active{background:#ffffff13;color:white}}

<script>
const pages=["overview","files","terminal","ai","backups","users","audit","integrations","settings"];let me,page="overview";const q=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));async function api(u,o={}){let r=await fetch(u,{credentials:"same-origin",...o}),d=await r.json();if(!r.ok)throw(d.detail?.error||d.error||{code:"SYS-001",message:"Request failed"});return d}function nav(){let f=x=>'<button data-p="'+x+'" class="'+(x===page?"active":"")+'">'+x[0].toUpperCase()+x.slice(1)+"</button>";q("#nav").innerHTML=pages.map(f).join("");q("#mobile").innerHTML=pages.map(f).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{q("#mobile").classList.remove("open");q("#hamb").setAttribute("aria-expanded","false");open(b.dataset.p)})}function show(){q("#login").classList.add("hidden");q("#app").classList.remove("hidden");q("#who").textContent=me.username;q("#role").textContent=me.role;nav();open("overview")}async function start(){setTimeout(()=>q("#boot").classList.add("hide"),650);try{me=await api("/api/me");show()}catch(e){q("#login").classList.remove("hidden")}}q("#lf").onsubmit=async e=>{e.preventDefault();try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:q("#u").value,password:q("#p").value})});me=d.user;show()}catch(x){q("#err").textContent=x.code+": "+x.message}};q("#hamb").onclick=()=>{let o=q("#mobile").classList.toggle("open");q("#hamb").setAttribute("aria-expanded",String(o));q("#hamb").textContent=o?"×":"☰"};q("#logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()};function open(p){page=p;nav();q("#title").textContent=p[0].toUpperCase()+p.slice(1);({overview,files,terminal,ai,backups,users,audit,integrations,settings}[p])().catch(x=>q("#content").innerHTML='<div class="card glass">'+E(x.code)+": "+E(x.message)+"</div>")}async function overview(){let d=await api("/api/system"),b=await api("/api/booster");q("#content").innerHTML='<div class="card glass wide" style="margin-bottom:14px"><div class="row"><div><b>Performance Booster</b><div class="small">Raises Cloud OS process scheduling priority. No overclocking.</div></div><button id="boost" class="btn primary">'+(b.mode==="boosted"?"Return Normal":"Boost Cloud OS")+'</button></div></div>'+'<div class="grid">'+[["CPU",d.cpu],["Memory",d.ram],["Storage",d.disk]].map(x=>'<div class="card glass metric"><span class="muted">'+x[0]+'</span><b>'+Math.round(x[1])+'%</b><div class="bar"><i style="width:'+x[1]+'%"></i></div></div>').join("")+'<div class="card glass wide">'+E(d.platform)+' · Cloud OS v'+E(d.version)+' · uptime '+Math.floor(d.uptime/60)+' min</div></div>'}async function files(){let a=await api("/api/files");q("#content").innerHTML='<div class="card glass"><h3>Files</h3><div class="list">'+a.map(x=>'<div class="row"><span>'+E(x.name)+'</span><span class="small">'+(x.directory?"Folder":E(x.size)+" bytes")+'</span></div>').join("")+'</div></div>'}async function terminal(){let s=await api("/api/terminal/shells");q("#content").innerHTML='<div class="terminal"><div class="lights"><i></i><i></i><i></i> '+E(s.shells.join(", "))+'</div><pre id="out">Cloud OS terminal\n</pre><form id="tf" class="termform"><input id="cmd" placeholder="Enter command…"><button>Run</button></form></div>';q("#tf").onsubmit=async e=>{e.preventDefault();let c=q("#cmd").value;q("#cmd").value="";q("#out").textContent+="> "+c+"\n";try{let r=await api("/api/terminal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:c,shell:s.shells[0]})});q("#out").textContent+=(r.stdout||"")+(r.stderr||"")}catch(x){q("#out").textContent+=x.code+": "+x.message+"\n"}}}async function ai(){let s=await api("/api/ai/status");q("#content").innerHTML='<div class="grid"><div class="card glass wide"><h3>Cloud OS AI Help</h3><p class="muted">Uses Cloud OS Markdown documentation as local reference context. API keys stay server-side.</p><div class="row"><select id="provider" class="btn">'+Object.entries(s).map(([k,v])=>'<option value="'+k+'">'+k+(v.configured?" · configured":" · not configured")+'</option>').join("")+'</select><button id="setupAI" class="btn">Configure provider</button></div><textarea id="question" style="width:100%;min-height:120px;margin-top:12px;background:#080a0f88;color:white;border:1px solid #ffffff17;border-radius:13px;padding:13px" placeholder="Ask about an error, setup issue, or Cloud OS feature…"></textarea><button id="askAI" class="btn primary" style="margin-top:10px">Ask Cloud OS AI</button><pre id="answer" style="white-space:pre-wrap;line-height:1.55"></pre></div></div>';q("#setupAI").onclick=async()=>{let provider=q("#provider").value,key=prompt("Paste "+provider+" API key. It will be sent only to your Cloud OS server."),model=prompt("Model name (leave blank for default)","");if(!key)return;try{await api("/api/ai/configure",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider,api_key:key,model:model||""})});ai()}catch(e){alert(e.code+": "+e.message)}};q("#askAI").onclick=async()=>{let prompt=q("#question").value.trim();if(!prompt)return;q("#answer").textContent="Thinking…";try{let r=await api("/api/ai/help",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:q("#provider").value,prompt})});q("#answer").textContent=r.answer}catch(e){q("#answer").textContent=e.code+": "+e.message}}}
async function backups(){let a=await api("/api/backups");q("#content").innerHTML='<div class="card glass"><h3>Backups</h3><div class="list">'+a.map(x=>'<div class="row">'+E(x)+'</div>').join("")+'</div></div>'}async function users(){let a=await api("/api/users");q("#content").innerHTML='<div class="card glass"><h3>Users</h3><div class="list">'+a.map(x=>'<div class="row"><span>'+E(x.username)+'</span><span>'+E(x.role)+'</span></div>').join("")+'</div></div>'}async function audit(){let a=await api("/api/audit");q("#content").innerHTML='<div class="card glass"><h3>Audit</h3><div class="list">'+a.slice().reverse().map(x=>'<div class="row"><span>'+E(x.action)+'</span><span class="small">'+E(x.time)+'</span></div>').join("")+'</div></div>'}async function integrations(){let d=await api("/api/integrations");q("#content").innerHTML='<div class="grid">'+Object.entries(d).map(([k,v])=>'<div class="card glass"><h3>'+E(k)+'</h3><pre>'+E(JSON.stringify(v,null,2))+'</pre></div>').join("")+'</div>'}async function settings(){let d=await api("/api/doctor");q("#content").innerHTML='<div class="card glass"><h3>System health</h3><div class="list">'+d.checks.map(x=>'<div class="row"><span>'+E(x.name)+'</span><span>'+(x.ok?"PASS":"WARN")+'</span></div>').join("")+'</div></div>'}start();
</script></body></html>
