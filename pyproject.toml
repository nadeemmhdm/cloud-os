[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-os"
version = "0.4.0"
description = "Lightweight self-hosted personal cloud server"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115","uvicorn>=0.30","psutil>=6.0","typer>=0.12","python-multipart>=0.0.9","asyncssh>=2.20,<3"]

[project.scripts]
cloud-os = "cloud_os.cli:app"

[tool.setuptools.packages.find]
include = ["cloud_os*"]

[project.optional-dependencies]
test = ["pytest>=8.0","httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cloud_os = ["dashboard.html","cloud-os-logo.svg","share-ui.js"]
